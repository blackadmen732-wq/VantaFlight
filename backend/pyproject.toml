[project]
name = "vantaflight"
version = "0.9.0"
description = "VantaFlight Flight Core - local-first autonomous drone platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["vantaflight*"]
